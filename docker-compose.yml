services:
  db:
    image: postgres:16-alpine
    container_name: navoke_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-navoke_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт 5432 доступен только внутри Docker-сети (db:5432).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: navoke_redis
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    # Порт 6379 доступен только внутри Docker-сети (redis:6379).
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: navoke_backend
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY is required}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}

      - "DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/1"
      - "CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"

      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID:?YOOKASSA_SHOP_ID is required}
      - YOOKASSA_SECRET_KEY=${YOOKASSA_SECRET_KEY:?YOOKASSA_SECRET_KEY is required}
      - "YOOKASSA_RETURN_URL=${YOOKASSA_RETURN_URL:-https://navoke.relaxdev.ru/order-success/}"
      - YOOKASSA_TRUST_PROXY=${YOOKASSA_TRUST_PROXY:-False}

      - FIREBASE_CREDENTIALS=${FIREBASE_CREDENTIALS:?FIREBASE_CREDENTIALS is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
